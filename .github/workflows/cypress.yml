name: Cypress
on: [push, pull_request]
jobs:
  CI:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2

      - name: Install
        run: |
          bun install --frozen-lockfile
          bunx cypress install

      - name: Build
        run: bun run build

      - name: Cypress run
        uses: cypress-io/github-action@v6
        with:
          install: false
          command: bunx cypress run
          start: bun run dev --host 127.0.0.1 --port 5173 --strictPort
          wait-on: "http://localhost:5173"
