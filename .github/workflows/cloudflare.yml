name: Cloudflare delivery
on:
  pull_request:
    branches: [master, codex/cloudflare-delivery]
  push:
    branches: [master]
permissions: {}
concurrency:
  group: delivery-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
jobs:
  checks:
    name: postcards / build and core flow
    if: github.repository_id == '277046734' && ((github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'pull_request' && github.event.pull_request.base.repo.id == 277046734 && github.event.pull_request.head.repo.id == 277046734 && (github.event.pull_request.base.ref == 'master' || (github.event.pull_request.number == 15 && github.event.pull_request.base.ref == 'codex/cloudflare-delivery' && github.event.pull_request.head.ref == 'codex/trusted-worker-delivery-source'))))
    runs-on:
      group: approved-public-ci
      labels: ${{ vars.PUBLIC_CI_RUNNER_LABEL == 'public-app-ci-prod' && 'public-app-ci-prod' || 'public-ci-onboarding-required' }}
    timeout-minutes: 30
    permissions:
      contents: read
    env:
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - name: Verify runner isolation
        run: |
          test "$(uname -s)" = Linux
          test "$(id -u)" -ne 0
          test ! -S /var/run/docker.sock
          test ! -e /var/run/secrets/kubernetes.io/serviceaccount/token
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.18.0'
      - run: bun test tests/workflow-safety.test.mjs tests/source-admission.test.ts
      - run: bun install --cwd scripts/cd/tooling --frozen-lockfile --ignore-scripts
      - run: node --test scripts/release/*.test.mjs scripts/cd/*.test.mjs
      - run: bun test scripts/cd/workflow.test.ts
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium
      - run: bun run build
      - run: bun run test && bun run test:worker
      - name: Browser core flow on local Worker
        run: bun run test:browser
      - name: Package complete immutable Worker and asset inventory
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: node scripts/release/artifact.mjs
      - name: Preserve digest-bound complete release
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: worker-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/
          if-no-files-found: error
          retention-days: 7
  lighthouse:
    if: github.repository_id == '277046734' && ((github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'pull_request' && github.event.pull_request.base.repo.id == 277046734 && github.event.pull_request.head.repo.id == 277046734 && (github.event.pull_request.base.ref == 'master' || (github.event.pull_request.number == 15 && github.event.pull_request.base.ref == 'codex/cloudflare-delivery' && github.event.pull_request.head.ref == 'codex/trusted-worker-delivery-source'))))
    name: Postcards / unchanged Lighthouse assertions
    needs: checks
    runs-on:
      group: approved-public-ci
      labels: ${{ vars.PUBLIC_CI_RUNNER_LABEL == 'public-app-ci-prod' && 'public-app-ci-prod' || 'public-ci-onboarding-required' }}
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Verify runner isolation
        run: |
          test "$(uname -s)" = Linux
          test "$(id -u)" -ne 0
          test ! -S /var/run/docker.sock
          test ! -e /var/run/secrets/kubernetes.io/serviceaccount/token
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.18.0'
      - run: bun install --frozen-lockfile
      - run: bunx playwright install chromium
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: worker-${{ github.event.pull_request.head.sha || github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: release/
      - name: Verify exact complete source artifact before unchanged audit
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          node scripts/release/artifact.mjs --verify
          test ! -e build
          cp -R release/assets build
      - name: Preserve unchanged Lighthouse assertions
        run: |
          CHROME_PATH=$(node --input-type=module -e 'import {chromium} from "@playwright/test";console.log(chromium.executablePath())')
          export CHROME_PATH
          bun run test:lighthouse
  required:
    name: ci-required
    if: always() && (github.repository_id == '277046734' && ((github.event_name == 'push' && github.ref == 'refs/heads/master') || (github.event_name == 'pull_request' && github.event.pull_request.base.repo.id == 277046734 && github.event.pull_request.head.repo.id == 277046734 && (github.event.pull_request.base.ref == 'master' || (github.event.pull_request.number == 15 && github.event.pull_request.base.ref == 'codex/cloudflare-delivery' && github.event.pull_request.head.ref == 'codex/trusted-worker-delivery-source')))))
    needs: [checks, lighthouse]
    runs-on:
      group: approved-public-ci
      labels: ${{ vars.PUBLIC_CI_RUNNER_LABEL == 'public-app-ci-prod' && 'public-app-ci-prod' || 'public-ci-onboarding-required' }}
    timeout-minutes: 5
    steps:
      - env:
          CHECKS: ${{ needs.checks.result }}
          LIGHTHOUSE: ${{ needs.lighthouse.result }}
        run: test "$CHECKS" = success && test "$LIGHTHOUSE" = success
